<nav class="navbar navbar-expand-lg navbar-dark tmo-navbar">
  <div class="container-fluid">
    <!-- LOGO -->
    <a class="navbar-brand" routerLink="/mangas">
      <i class="bi bi-book-half"></i>
      TMO Library
      <span *ngIf="isAdmin() || isEditor()">{{ user?.role }}</span>
    </a>

    <!-- MOBILE BUTTON -->
    <button
      class="navbar-toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#navbarContent"
      aria-label="Alternar navegación"
    >
      <span class="navbar-toggler-icon"></span>
    </button>

    <!-- NAV LINKS -->

    <div class="collapse navbar-collapse" id="navbarContent">
      <ul class="navbar-nav me-auto">
        <!-- MANGAS -->
        <li class="nav-item">
          <a class="nav-link" routerLink="/mangas" routerLinkActive="active"> Mangas </a>
        </li>

        <!-- DASHBOARD (ADMIN) -->
        <li class="nav-item dropdown" *ngIf="isAdmin()">
          <a
            class="nav-link dropdown-toggle"
            role="button"
            data-bs-toggle="dropdown"
            aria-expanded="false"
          >
            Gestionar usuarios
          </a>
          <ul class="dropdown-menu">
            <li>
              <a class="dropdown-item" routerLink="/dashboard" routerLinkActive="active"
                >Dashboard</a
              >
            </li>
            <li>
              <hr class="dropdown-divider" />
            </li>
            <li>
              <a class="dropdown-item" routerLink="/usuarios" routerLinkActive="active">Usuarios</a>
            </li>
          </ul>
        </li>
      </ul>

      <!-- USER INFO -->

      <ul class="navbar-nav ms-auto">
        <li class="nav-item dropdown">
          <img
            [src]="'icons/perfil.svg'"
            class="avatar dropdown-toggle rounded-circle"
            role="button"
            data-bs-toggle="dropdown"
            aria-expanded="false"
            alt="Menú de usuario"          
          />

          <ul class="dropdown-menu dropdown-menu-end perfil-dropdown">
            <!-- Usuario -->
            <li class="perfil-header">
              <img [src]="'icons/perfil.svg'" class="perfil-avatar"
              alt="Perfil de usuario"  />
              <div class="perfil-info">
                <div class="perfil-name">{{ user?.name }}</div>
                <div
                  class="perfil-role"
                  [ngClass]="{
                    'role-admin': user?.role === 'Admin',
                    'role-editor': user?.role === 'Editor',
                    'role-viewer': user?.role === 'Viewer',
                  }"
                >
                  {{ user?.role }}
                </div>
              </div>
            </li>
            <li>
              <button
                class="btn-perfil px-3 py-2 small mt-2"
                routerLink=""
                routerLinkActive="active"
              >
                <i class="bi bi-person-circle me-2"></i>
                Perfil
              </button>
            </li>
            <li>
              <hr class="dropdown-divider" />
            </li>
            <li>
              <button class="btn-logout px-3 py-2 small mb-2" (click)="logout()">
                <i class="bi bi-box-arrow-right me-2"></i>
                Cerrar sesión
              </button>
            </li>
          </ul>
        </li>
      </ul>
    </div>
  </div>
</nav>
