<app-manga-navbar></app-manga-navbar>
<div class="app">

  <!-- HEADER TMO -->

  <div class="header-tmo">

    <!-- BOTÓN CREAR -->
    <div class="admin-actions-bar">
      <button *ngIf="canEdit()" routerLink="/mangas/crear" class="btn-create">
        <i class="bi bi-plus-circle"></i>
        Nuevo Manga
      </button>
    </div>

  </div>

  <!-- GRID -->

  <div class="library-grid">

    <div class="media-card" *ngFor="let manga of mangas">

      <!-- COVER -->
      <div class="media-preview">
        <img [src]="manga.coverUrl || 'https://placehold.co/400x240'">
        <span class="status-badge" [ngClass]="getStatusClass(manga.status)">
          {{ manga.status }}
        </span>
      </div>

      <!-- INFO -->
      <div class="media-info">

        <div class="media-title">

          <span>
            {{ manga.title }}
          </span>

          <span class="media-type">
            {{ manga.genre }}
          </span>
        </div>

        <div class="meta-row">
          <span>
            <i class="bi bi-calendar3"></i>
            {{ manga.year }}
          </span>

          <span class="chapters-info">
            <i class="bi bi-journal-bookmark"></i>
            {{ manga.chapters }} caps
          </span>
        </div>

        <div class="meta-row">
          <span>
            <i class="bi bi-person-lines-fill"></i>
            {{ manga.author }}
          </span>
        </div>

        <!-- ACTIONS -->
        <div class="card-admin-icons" *ngIf="canEdit()">
          <button routerLink="/mangas/editar/{{manga._id}}" class="icon-edit">
            <i class="bi bi-pencil-square"></i>
            Editar
          </button>

          <button *ngIf="isAdmin()" (click)="deleteManga(manga)" class="icon-del">
            <i class="bi bi-trash"></i>
            Eliminar
          </button>
        </div>

        <!-- VER -->
        <button routerLink="/mangas/{{manga._id}}" class="btn-view">
          Ver detalles
        </button>

      </div>
    </div>
  </div>
</div>

<!-- MODAL DELETE -->
@if (mangaToDelete) {
<div class="manga-modal-overlay" (click)="cancelDelete()">
  <div class="manga-modal-delete" (click)="$event.stopPropagation()">
    <h3 class="manga-modal-title border-bottom pb-2">Eliminar Manga</h3>
    <p class="manga-modal-body">
      ¿Seguro que deseas eliminar el manga
      <strong>{{ mangaToDelete.title }}</strong>?
      Esta accion no se puede deshacer.
    </p>

    <div class="manga-modal-actions border-top pt-3 mt-2">

      <button type="button" class="btn-cancel" (click)="cancelDelete()">
        Cancelar
      </button>

      <button type="button" class="btn-confirm-delete" (click)="confirmDelete()">
        <i class="bi bi-exclamation-triangle-fill"></i>
        {{ isDeleting ? 'Eliminando...' : 'Eliminar' }}
      </button>

    </div>
  </div>
</div>
}
